name: CI Pipeline - SOC Node

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ansible-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint checkov

      - name: Run Ansible Lint
        run: ansible-lint playbooks/site.yml

      # FIX: SAST Security Scanning für Playbooks und Systemd-Templates
      - name: Checkov Ansible Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: playbooks
          framework: ansible
          soft_fail: false
